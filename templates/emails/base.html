<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="supported-color-schemes" content="dark">
  <title>BrickMissing</title>
</head>
<body style="margin:0;padding:0;background:#090711;color:#f7f4ff;font-family:Arial,Helvetica,sans-serif;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">{% block preheader %}Nachricht von BrickMissing.{% endblock %}</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#090711;">
    <tr><td align="center" style="padding:24px 12px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:600px;">
        <tr><td align="center" style="padding:8px 16px 24px;">
          <div style="font-size:22px;line-height:28px;font-weight:800;letter-spacing:2px;color:#b48cff;">BRICKMISSING</div>
          <div style="padding-top:4px;font-size:14px;line-height:20px;color:#b9afcc;">LEGO Collection Manager</div>
        </td></tr>
        <tr><td style="padding:28px 24px;background:#191326;border:1px solid #3a2c52;border-radius:16px;color:#f7f4ff;">
          {% block content %}{% endblock %}
        </td></tr>
        <tr><td align="center" style="padding:24px 16px 8px;font-size:13px;line-height:21px;color:#998daa;">
          <div>BrickMissing · stylepanda.me</div>
          <div style="padding-top:6px;"><a href="{{ privacy_url }}" style="color:#bda2ff;text-decoration:underline;">Datenschutz</a><span aria-hidden="true"> · </span><a href="{{ imprint_url }}" style="color:#bda2ff;text-decoration:underline;">Impressum</a></div>
          <div style="padding-top:10px;">Unabhängige Anwendung zur Verwaltung privater LEGO-Sammlungen.</div>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
