<article class="print-label label-number-collection{% if not label %} is-empty{% endif %}">{% if label %}<div class="number-grid">{% for cell in label.number_cells %}<strong class="number-grid-item{% if forloop.first %} is-first{% endif %}{% if cell.has_right_cut %} has-cut-line has-right-cut{% else %} is-last{% endif %}{% if cell.has_bottom_cut %} has-bottom-cut{% endif %}">{{ cell.number }}</strong>{% endfor %}</div>{% endif %}</article>
