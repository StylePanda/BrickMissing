<article class="print-label label-number-collection{% if not label %} is-empty{% endif %}">{% if label %}<div class="number-grid">{% for number in label.numbers %}<strong class="number-grid-item{% if forloop.first %} is-first{% endif %}{% if not forloop.last %} has-cut-line{% else %} is-last{% endif %}">{{ number }}</strong>{% endfor %}</div>{% endif %}</article>
