{% if page_obj.paginator.num_pages > 1 %}<nav class="pagination compact" aria-label="Seitennavigation für Suchergebnisse">{% if page_obj.has_previous %}<a href="?q={{ query|urlencode }}&amp;{{ page_parameter }}={{ page_obj.previous_page_number }}">Zurück</a>{% endif %}<span>Seite {{ page_obj.number }} von {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a href="?q={{ query|urlencode }}&amp;{{ page_parameter }}={{ page_obj.next_page_number }}">Weiter</a>{% endif %}</nav>{% endif %}
