{% extends "base.html" %}{% block title %}Gespeicherte Ansichten{% endblock %}{% block content %}
<h1>Gespeicherte Ansichten</h1>
<section class="panel">{% for item in saved_views %}<div class="row"><a href="{{ item.path }}{% if item.configuration.query %}?{{ item.configuration.query }}{% endif %}">{{ item.name }} · {{ item.area }}</a><form method="post">{% csrf_token %}<input type="hidden" name="pk" value="{{ item.pk }}"><input type="hidden" name="area" value="{{ item.area }}"><input type="hidden" name="path" value="{{ item.path }}"><input type="hidden" name="query" value="{{ item.configuration.query }}"><label>Umbenennen <input name="name" value="{{ item.name }}" required maxlength="191"></label><button>Speichern</button></form><form method="post" action="{% url 'saved_view_delete' item.pk %}">{% csrf_token %}<button class="danger">Löschen</button></form></div>{% empty %}<p>Keine Ansichten gespeichert.</p>{% endfor %}</section>
{% endblock %}
