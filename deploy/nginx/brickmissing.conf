limit_req_zone $binary_remote_addr zone=brickmissing_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name BRICKMISSING_DOMAIN;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name BRICKMISSING_DOMAIN;
    server_tokens off;

    # Certbot ergänzt/verwaltet ssl_certificate und ssl_certificate_key.
    client_max_body_size 5m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    error_page 503 @maintenance;
    if (-f /var/www/brickmissing/shared/var/maintenance.enabled) { return 503; }
    location @maintenance {
        root /var/www/brickmissing/current/deploy/nginx;
        rewrite ^ /maintenance.html break;
        internal;
    }

    location /static/ {
        alias /var/www/brickmissing/shared/var/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Private Uploads werden nie als frei durchsuchbares /media-Verzeichnis ausgeliefert.
    location /media/ { return 404; }

    location ~ ^/konto/(anmelden|registrieren|passwort-vergessen)/ {
        limit_req zone=brickmissing_auth burst=5 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 65s;
        proxy_pass http://127.0.0.1:8000;
    }
}
